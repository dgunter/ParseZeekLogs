[project]
name = "parsezeeklogs"
version = "3.0.0"
description = "Read Zeek (Bro) network security monitor logs, TSV or JSON, into typed Python records; convert to JSON or CSV; load into Elasticsearch."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Dan Gunter" }]
requires-python = ">=3.10"
keywords = ["zeek", "bro", "nsm", "network security monitoring", "logs", "dfir", "elasticsearch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
elasticsearch = ["elasticsearch>=9.0,<10"]

[project.urls]
Homepage = "https://github.com/dgunter/ParseZeekLogs"
Issues = "https://github.com/dgunter/ParseZeekLogs/issues"

[project.scripts]
parsezeeklogs = "parsezeeklogs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "elasticsearch>=9.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "parsezeeklogs",
    "tests",
    "scripts",
    "docker-compose.yml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE.txt",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["parsezeeklogs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Elasticsearch (see docker-compose.yml)",
    "samples: needs the generated PCAP-ATTACK Zeek corpus (see scripts/generate_zeek_logs.sh)",
]
addopts = "-m 'not integration and not samples'"

[tool.coverage.run]
source = ["parsezeeklogs"]
branch = true
omit = ["parsezeeklogs/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".github/scripts", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
